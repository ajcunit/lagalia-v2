            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Esborra una tasca
      x-required-scopes: [tasks:write]
      responses:
        "204": { description: Esborrada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{id}/actions/complete:
    post:
      tags: [tasks]
      operationId: completeTask
      summary: Completa la tasca (si té RRULE, genera la següent ocurrència)
      x-required-scopes: [tasks:update_status]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCompleteRequest" }
      responses:
        "200":
          description: Tasca completada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tasks/{id}/actions/cancel:
    post:
      tags: [tasks]
      operationId: cancelTask
      summary: Cancel·la la tasca
      x-required-scopes: [tasks:update_status]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCompleteRequest" }
      responses:
        "200":
          description: Tasca cancel·lada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tasks/{id}/actions/reopen:
    post:
      tags: [tasks]
      operationId: reopenTask
      summary: Reobre una tasca feta o cancel·lada
      x-required-scopes: [tasks:update_status]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Tasca reoberta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tasks/{id}/actions/start:
    post:
      tags: [tasks]
      operationId: startTask
      summary: Passa la tasca a en curs
      x-required-scopes: [tasks:update_status]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Tasca en curs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tasks/{id}/history:
    get:
      tags: [tasks]
      operationId: getTaskHistory
      summary: Historial de canvis de la tasca
      x-required-scopes: [tasks:read]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Canvis, el més recent primer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TaskHistoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/ical-key:
    post:
      tags: [tasks]
      operationId: rotateIcalKey
      summary: Genera o regenera la clau del feed iCal (regenerar revoca l'anterior)
      x-required-scopes: [tasks:read]
      responses:
        "201":
          description: Clau nova
          content:
            application/json:
              schema:
                type: object
                required: [key, url]
                properties:
                  key: { type: string }
                  url: { type: string, description: Ruta del feed amb la clau. }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [tasks]
      operationId: revokeIcalKey
      summary: Revoca la clau del feed iCal
      x-required-scopes: [tasks:read]
      responses:
        "204": { description: Revocada }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/tasks.ics:
    get:
      tags: [tasks]
      operationId: getTasksIcalFeed
      summary: Feed iCal de les tasques obertes (subscripció Outlook)
      description: |
        Autorització per clau opaca revocable (`POST /me/ical-key`); mai el
        JWT de sessió per query string.
      security: []
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string, minLength: 16, maxLength: 64 }
      responses:
        "200":
          description: VCALENDAR amb les tasques obertes de l'usuari
          content:
            text/calendar:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────────── contractors ─────────────────────────
  /contractors:
    get:
      tags: [contractors]
      operationId: listContractors
      summary: Rànquing unificat d'adjudicataris (majors + menors)
      description: |
        Agregats sobre el conjunt complet de dades (font pública), amb
        independència de l'abast departamental de l'usuari.
      x-required-scopes: [contracts:read]
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageCursor"
        - name: q
          in: query
          description: Nom (canònic o àlies) o NIF.
          schema: { type: string, maxLength: 200 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [total_amount, -total_amount, contracts_count, -contracts_count, name, -name]
            default: "-total_amount"
      responses:
        "200":
          description: Rànquing
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContractorRanking" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /contractors/duplicates:
    get:
      tags: [contractors]
      operationId: listContractorDuplicates
      summary: Parells de possibles duplicats per NIF
      x-required-scopes: [duplicates:manage]
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageCursor"
        - name: status
          in: query
          schema: { type: string, enum: [pending, merged, rejected], default: pending }
      responses:
        "200":
          description: Parells detectats
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContractorDuplicate" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /contractors/duplicates/groups:
    get:
      tags: [contractors]
      operationId: listContractorDuplicateGroups
      summary: Grups de duplicats per NIF (un grup = un cas de revisió)
      x-required-scopes: [duplicates:manage]
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageCursor"
        - name: q
          in: query
          description: Filtra per NIF o nom de qualsevol variant del grup.
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Grups pendents, ordenats per mida
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContractorDuplicateGroup" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /contractors/duplicates/groups/resolve:
    post:
      tags: [contractors]
      operationId: resolveContractorDuplicateGroup
      summary: Resol un grup sencer (fusió en bloc al canònic triat, o rebuig)
      x-required-scopes: [duplicates:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tax_id, action]
              properties:
                tax_id: { type: string, maxLength: 100 }
                action: { type: string, enum: [merge, reject] }
                canonical_id:
                  type: [integer, "null"]
                  format: int64
                  description: Obligatori amb action=merge; membre del grup.
      responses:
        "200":
          description: Resum de la resolució
          content:
            application/json:
              schema:
                type: object
                required: [merged, rejected]
                properties:
                  merged: { type: integer }
                  rejected: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /contractors/duplicates/{id}/actions/resolve:
    post:
      tags: [contractors]
      operationId: resolveContractorDuplicate
      summary: Resol un parell (fusió o rebuig)
      description: |
        `merge_1`/`merge_2`: el contractor indicat esdevé el canònic; l'altre
        transfereix contractes i menors, el seu nom queda com a àlies i
        s'elimina. `reject`: el parell es tanca i no es regenera.
      x-required-scopes: [duplicates:manage]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [merge_1, merge_2, reject] }
                notes: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Parell resolt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractorDuplicate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: El parell ja està resolt
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /contractors/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [contractors]
      operationId: getContractor
      summary: Fitxa d'un adjudicatari amb KPIs
      x-required-scopes: [contracts:read]
      responses:
        "200":
          description: Adjudicatari
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractorProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── jobs ─────────────────────────────
  /jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [jobs]
      operationId: getJob
      summary: Estat i progrés d'un treball
      description: |
        Visible per al creador del treball; per a la resta cal la concessió
        `sync:read` de la matriu de permisos.
      responses:
        "200":
          description: Treball
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{id}/events:
    get:
      tags: [jobs]
      operationId: streamJobEvents
      summary: Progrés en temps real (SSE)
      description: |
        Server-Sent Events. S'autentica amb un token efímer d'un sol ús
        emès per `POST /auth/ephemeral` (purpose `job_events`) — mai un JWT
        per query string. Emet l'estat actual en connectar i tanca quan el
        treball arriba a un estat terminal.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: token
          in: query
          required: true
          description: Token efímer d'un sol ús.
          schema: { type: string }
      responses:
        "200":
          description: Flux d'esdeveniments `text/event-stream`
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{id}/actions/cancel:
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel·la un treball encuat o en execució
      description: |
        Permès al creador del treball o amb la concessió `sync:execute`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Cancel·lació sol·licitada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: El treball ja és en un estat terminal
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  # ───────────────────────────── users ─────────────────────────────
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Llista d'usuaris
      x-required-scopes: [users:read]
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/ViewScope"
        - name: filter[active]
          in: query
          schema: { type: boolean }
        - name: filter[role]
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: filter[department_id]
          in: query
          schema: { type: integer, format: int64 }
        - name: sort
          in: query
          schema: { type: string, examples: ["name", "-created_at"] }
      responses:
        "200":
          description: Pàgina d'usuaris
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: createUser
      summary: Crea un usuari
      x-required-scopes: [users:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Usuari creat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: El correu ja existeix
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [users]
      operationId: getUser
      summary: Detall d'un usuari
      x-required-scopes: [users:read]
      responses:
        "200":
          description: Usuari
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Actualitza un usuari
      x-required-scopes: [users:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Usuari actualitzat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [users]
      operationId: deactivateUser
      summary: Desactiva un usuari
      description: |
        Baixa lògica: l'usuari es marca inactiu i **es revoquen totes les seves
        sessions** (famílies de refresh tokens). No s'esborra cap dada històrica.
      x-required-scopes: [users:write]
      responses:
        "204": { description: Usuari desactivat }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── departments ─────────────────────────────
  /departments:
    get:
      tags: [departments]
      operationId: listDepartments
      summary: Llista de departaments
      x-required-scopes: [departments:read]
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageCursor"
        - name: filter[active]
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Pàgina de departaments
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Department" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [departments]
      operationId: createDepartment
      summary: Crea un departament
      x-required-scopes: [departments:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepartmentCreate" }
      responses:
        "201":
          description: Departament creat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Department" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: El codi ja existeix
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /departments/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [departments]
      operationId: getDepartment
      summary: Detall d'un departament
      x-required-scopes: [departments:read]
      responses:
        "200":
          description: Departament
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Department" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [departments]
      operationId: updateDepartment
      summary: Actualitza un departament
      x-required-scopes: [departments:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepartmentUpdate" }
      responses:
        "200":
          description: Departament actualitzat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Department" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [departments]
      operationId: deactivateDepartment
      summary: Desactiva un departament (baixa lògica)
      x-required-scopes: [departments:write]
      responses:
        "204": { description: Departament desactivat }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /departments/{id}/users:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [departments]
      operationId: listDepartmentUsers
      summary: Usuaris d'un departament
      x-required-scopes: [users:read]
      responses:
        "200":
          description: Usuaris del departament
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token d'accés d'usuari (JWT curt) o clau de compte de servei (`sk_...`)
        per a agents d'IA i integracions. Sempre a la capçalera `Authorization`;
        mai per query string.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

    ConnectorSlug:
      name: slug
      in: path
      required: true
      schema: { type: string, minLength: 2, maxLength: 50, pattern: "^[a-z0-9_-]+$" }

    ResourceUuid:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

    PageSize:
      name: page[size]
      in: query
      description: Elements per pàgina.
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }

    PageCursor:
      name: page[cursor]
      in: query
      description: Cursor de la pàgina següent, retornat a `meta.next_cursor`.
      schema: { type: string }

    ViewScope:
      name: view
      in: query
      description: |
        Abast demanat. `user` (per defecte) limita als departaments propis;
        `all` demana abast complet i **només s'accepta** si el rol de l'usuari ho
        permet — es valida al servidor, no és una preferència del client.
      schema: { type: string, enum: [user, all], default: user }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Clau única del client per evitar duplicats en reintents. Repetir la
        mateixa clau retorna el resultat original en comptes de crear un recurs nou.
      schema: { type: string, maxLength: 128 }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    Unauthorized:
      description: Cal autenticar-se o la sessió ha caducat
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    Forbidden:
      description: Autenticat però sense permís per a aquesta acció o recurs
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    NotFound:
      description: Recurs inexistent o fora del teu abast
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    Conflict:
      description: L'acció entra en conflicte amb l'estat actual del recurs
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    ValidationError:
      description: Dades d'entrada no vàlides
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

    RateLimited:
      description: Massa peticions
      headers:
        Retry-After:
          schema: { type: integer }
          description: Segons a esperar abans de reintentar.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: Error segons RFC 9457. Mai inclou el cos de la petició original.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, examples: ["https://lagalia/errors/validation"] }
        title: { type: string, examples: ["Dades no vàlides"] }
        status: { type: integer, examples: [422] }
        detail: { type: string }
        instance: { type: string }
        trace_id:
          type: string
          description: Identificador de traça per a suport.
        errors:
          type: array
          description: Errors per camp, quan aplica.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    PageMeta:
      type: object
      required: [total]
      properties:
        total: { type: integer }
        next_cursor:
          type: [string, "null"]

    Role:
      type: string
      enum: [admin, procurement_manager, dept_manager, employee]
      description: |
        Rols del sistema. Equivalència amb la v1: `procurement_manager` =
        `responsable_contratacion`, `dept_manager` = `responsable`,
        `employee` = `empleado`.

    Password:
      type: string
      format: password
      minLength: 12
      description: |
        Mínim 12 caràcters amb majúscula, minúscula i xifra. Es rebutgen les
        contrasenyes presents en llistes de credencials filtrades.

    Ine10Code:
      type: string
      pattern: "^[0-9]{10}$"
      description: Codi INE de 10 dígits de l'ens.
      examples: ["4305160009"]

    MinorContract:
      type: object
      required: [id, file_code, internal_status]
      properties:
        id: { type: integer, format: int64 }
        file_code: { type: string }
        contract_type: { type: [string, "null"] }
        description: { type: [string, "null"] }
        contractor: { oneOf: [{ $ref: "#/components/schemas/ContractorRef" }, { type: "null" }] }
        award_amount: { type: [string, "null"] }
        award_date: { type: [string, "null"], format: date }
        fiscal_year: { type: [integer, "null"] }
        duration_years: { type: [integer, "null"] }
        duration_months: { type: [integer, "null"] }
        duration_days: { type: [integer, "null"] }
        settlement_type: { type: [string, "null"] }
        settlement_date: { type: [string, "null"], format: date }
        settlement_amount: { type: [string, "null"] }
        internal_status: { type: string, enum: [normal, pending_review, approved, rejected] }
        department_ids:
          type: array
          items: { type: integer, format: int64 }
        last_synced_at: { type: [string, "null"], format: date-time }

    MinorContractUpdate:
      type: object
      properties:
        internal_status: { type: string, enum: [normal, pending_review, approved, rejected] }
        department_ids:
          type: array
          items: { type: integer, format: int64 }

    ContractorRanking:
      type: object
      required: [id, name, contracts_count, minor_count, total_amount]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        tax_id: { type: [string, "null"] }
        contracts_count: { type: integer }
        contracts_amount: { type: [string, "null"] }
        minor_count: { type: integer }
        minor_amount: { type: [string, "null"] }
        total_amount: { type: string }

    ContractorProfile:
      allOf:
        - $ref: "#/components/schemas/ContractorRanking"
        - type: object
          properties:
            nationality: { type: [string, "null"] }
            company_type: { type: [string, "null"] }
            third_sector: { type: boolean }
            phone: { type: [string, "null"] }
            email: { type: [string, "null"] }
            aliases:
              type: array
              items: { type: string }
            created_at: { type: string, format: date-time }

    ContractorDuplicate:
      type: object
      required: [id, status, contractor_1, contractor_2]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [pending, merged, rejected] }
        contractor_1: { $ref: "#/components/schemas/ContractorRanking" }
        contractor_2: { $ref: "#/components/schemas/ContractorRanking" }
        resolved_by: { type: [integer, "null"], format: int64 }
        resolved_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    Setting:
      type: object
      required: [key, is_secret, is_set]
      properties:
        key: { type: string }
        value: {}
        description: { type: [string, "null"] }
        is_secret: { type: boolean }
        is_set: { type: boolean }

    Connector:
      type: object
      required: [slug, name, enabled, mode, config, config_defaults, credentials]
      properties:
        slug: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        mode: { type: string }
        config: { type: object, additionalProperties: true }
        config_defaults: { type: object, additionalProperties: true }
        credentials:
          type: object
          additionalProperties: { type: boolean }
          description: "nom de credencial → is_set (mai el valor)."
        health_status: { type: [string, "null"] }
        last_health_check: { type: [string, "null"], format: date-time }

    AuditEntry:
      type: object
      required: [id, occurred_at, actor_type, action, success]
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        actor_type: { type: string, enum: [user, agent, system] }
        actor_id: { type: [integer, "null"], format: int64 }
        actor_name:
          type: [string, "null"]
          description: Nom resolt si l'actor és un usuari existent.
        action: { type: string }
        resource_type: { type: [string, "null"] }
        resource_id: { type: [string, "null"] }
        ip: { type: [string, "null"] }
        trace_id: { type: [string, "null"] }
        details: { type: [object, "null"], additionalProperties: true }
        success: { type: boolean }

    ServiceAccount:
      type: object
      required: [id, name, key_prefix, scopes, active]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, "null"] }
        key_prefix: { type: string, description: "Primers 12 caràcters, per identificar." }
        scopes:
          type: array
          items: { type: string }
        active: { type: boolean }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    Webhook:
      type: object
      required: [id, name, url, events, active, secret_is_set]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        url: { type: string }
        events:
          type: array
          items: { type: string }
        active: { type: boolean }
        secret_is_set: { type: boolean }
        created_at: { type: string, format: date-time }

    WebhookDelivery:
      type: object
      required: [id, event_type, status, attempts]
      properties:
        id: { type: integer, format: int64 }
        event_type: { type: string }
        status: { type: string, enum: [pending, delivered, failed] }
        attempts: { type: integer }
        last_error: { type: [string, "null"] }
        next_retry_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    TaskReminderSpec:
      type: object
      required: [offset_days]
      properties:
        offset_days:
          type: integer
          minimum: 0
          maximum: 365
          description: Dies abans del venciment (0 = el dia mateix).
        channel:
          type: string
          enum: [email, webhook]
          default: email

    TaskReminder:
      allOf:
        - $ref: "#/components/schemas/TaskReminderSpec"
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64 }
            sent_at: { type: [string, "null"], format: date-time }

    Task:
      type: object
      required: [id, title, task_type, due_date, priority, status, assignees, reminders]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: [string, "null"] }
        task_type:
          type: string
          enum: [review, extension, settlement, guarantee_return, report, meeting, other]
        due_date: { type: string, format: date }
        due_time: { type: [string, "null"] }
        priority: { type: string, enum: [low, normal, high] }
        status: { type: string, enum: [pending, in_progress, done, cancelled] }
        contract_id: { type: [integer, "null"], format: int64 }
        minor_contract_id: { type: [integer, "null"], format: int64 }
        department_id: { type: [integer, "null"], format: int64 }
        recurrence:
          type: [string, "null"]
          description: RRULE (RFC 5545); en completar-se es genera la següent ocurrència.
        parent_task_id: { type: [integer, "null"], format: int64 }
        created_by: { type: [integer, "null"], format: int64 }
        completed_by: { type: [integer, "null"], format: int64 }
        completed_at: { type: [string, "null"], format: date-time }
        resolution_notes: { type: [string, "null"] }
        assignees:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
        reminders:
          type: array
          items: { $ref: "#/components/schemas/TaskReminder" }
        created_at: { type: string, format: date-time }

    TaskCreate:
      type: object
      required: [title, due_date]
      properties:
        title: { type: string, minLength: 2, maxLength: 255 }
        description: { type: string }
        task_type:
          type: string
          enum: [review, extension, settlement, guarantee_return, report, meeting, other]
          default: other
        due_date: { type: string, format: date }
        due_time: { type: [string, "null"] }
        priority: { type: string, enum: [low, normal, high], default: normal }
        contract_id: { type: [integer, "null"], format: int64 }
        minor_contract_id:
          type: [integer, "null"]
          format: int64
          description: Cal contracte O menor (com a mínim un).
        department_id: { type: [integer, "null"], format: int64 }
        recurrence: { type: [string, "null"], maxLength: 255 }
        assignee_ids:
          type: array
          items: { type: integer, format: int64 }
          maxItems: 20
        reminders:
          type: array
          items: { $ref: "#/components/schemas/TaskReminderSpec" }
          maxItems: 10

    TaskUpdate:
      type: object
      properties:
        title: { type: string, minLength: 2, maxLength: 255 }
        description: { type: [string, "null"] }
        task_type:
          type: string
          enum: [review, extension, settlement, guarantee_return, report, meeting, other]
        due_date: { type: string, format: date }
        due_time: { type: [string, "null"] }
        priority: { type: string, enum: [low, normal, high] }
        department_id: { type: [integer, "null"], format: int64 }
        recurrence: { type: [string, "null"], maxLength: 255 }
        assignee_ids:
          type: array
          items: { type: integer, format: int64 }
          maxItems: 20
        reminders:
          type: array
          items: { $ref: "#/components/schemas/TaskReminderSpec" }
          maxItems: 10

    TaskCompleteRequest:
      type: object
      properties:
        resolution_notes: { type: [string, "null"], maxLength: 2000 }

    TaskHistoryEntry:
      type: object
      required: [id, field, changed_at]
      properties:
        id: { type: integer, format: int64 }
        field: { type: string }
        old_value: { type: [string, "null"] }
        new_value: { type: [string, "null"] }
        user_id: { type: [integer, "null"], format: int64 }
        changed_at: { type: string, format: date-time }

    TaskSuggestion:
      type: object
      required: [contract_id, file_code, task_type, title]
      properties:
        contract_id: { type: integer, format: int64 }
        file_code: { type: string }
        subject: { type: [string, "null"] }
        task_type: { type: string, enum: [extension, settlement] }
        title: { type: string }
        due_date: { type: [string, "null"], format: date }

    ContractorDuplicateGroup:
      type: object
      required: [tax_id, contractors]
      properties:
        tax_id: { type: string }
        contractors:
          type: array
          items: { $ref: "#/components/schemas/ContractorRanking" }

    ContractorRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        tax_id: { type: [string, "null"] }

    ContractSummary:
      type: object
      required: [id, file_code, status, lot, internal_status, expiry_warning, possibly_finished]
      properties:
        id: { type: integer, format: int64 }
        file_code: { type: string }
        status: { type: string }
        lot: { type: string }
        subject: { type: [string, "null"] }
        contract_type: { type: [string, "null"] }
        procedure: { type: [string, "null"] }
        contractor: { oneOf: [{ $ref: "#/components/schemas/ContractorRef" }, { type: "null" }] }
        award_amount: { type: [string, "null"], description: Decimal serialitzat }
        published_at: { type: [string, "null"], format: date-time }
        start_date: { type: [string, "null"], format: date }
        calculated_end_date: { type: [string, "null"], format: date }
        expiry_warning: { type: boolean }
        possibly_finished: { type: boolean }
        internal_status: { type: string, enum: [normal, pending_review, approved, rejected] }
        department_ids:
          type: array
          items: { type: integer, format: int64 }

    Contract:
      allOf:
        - $ref: "#/components/schemas/ContractSummary"
        - type: object
          required: [source, counters]
          properties:
            source: { type: string, enum: [local, external] }
            processing_type: { type: [string, "null"] }
            awarding_body: { type: [string, "null"] }
            awarding_department: { type: [string, "null"] }
            raw_contractor_name: { type: [string, "null"] }
            tender_amount: { type: [string, "null"] }
            award_amount_vat: { type: [string, "null"] }
            estimated_value: { type: [string, "null"] }
            budget_no_vat: { type: [string, "null"] }
            budget_vat: { type: [string, "null"] }
            formalized_at: { type: [string, "null"], format: date }
            end_date: { type: [string, "null"], format: date }
            duration_months: { type: [integer, "null"] }
            warning_months_override: { type: [integer, "null"] }
            cpv_code: { type: [string, "null"] }
            cpv_description: { type: [string, "null"] }
            nuts_code: { type: [string, "null"] }
            nuts_description: { type: [string, "null"] }
            financing: { type: [string, "null"] }
            links: { type: [object, "null"], additionalProperties: { type: string } }
            phase_urls: { type: [object, "null"], additionalProperties: { type: string } }
            received_offers: { type: [integer, "null"] }
            is_harmonized: { type: [boolean, "null"] }
            allows_extensions: { type: [boolean, "null"] }
            allows_modifications: { type: [boolean, "null"] }
            social_reserve: { type: [boolean, "null"] }
            subcontracting_allowed: { type: [boolean, "null"] }
            enriched_at: { type: [string, "null"], format: date-time }
            first_synced_at: { type: [string, "null"], format: date-time }
            last_synced_at: { type: [string, "null"], format: date-time }
            siblings:
              type: array
              description: Lots germans (mateix expedient).
              items: { $ref: "#/components/schemas/ContractSummary" }
            counters:
              type: object
              required: [extensions, modifications, history]
              properties:
                extensions: { type: integer }
                modifications: { type: integer }
                history: { type: integer }
            created_at: { type: string, format: date-time }

    ContractCreate:
      type: object
      required: [file_code, subject]
      properties:
        file_code: { type: string, minLength: 1, maxLength: 100 }
        status: { type: string, maxLength: 100, default: "" }
        lot: { type: string, maxLength: 50, default: "" }
        subject: { type: string, minLength: 3 }
        contract_type: { type: string }
        procedure: { type: string }
        processing_type: { type: string }
        award_amount: { type: string }
        tender_amount: { type: string }
        formalized_at: { type: string, format: date }
        duration_months: { type: integer, minimum: 1 }
        cpv_code: { type: string, maxLength: 255 }
        department_ids:
          type: array
          items: { type: integer, format: int64 }

    ContractUpdate:
      type: object
      properties:
        subject: { type: string, minLength: 3 }
        contract_type: { type: [string, "null"] }
        procedure: { type: [string, "null"] }
        processing_type: { type: [string, "null"] }
        internal_status: { type: string, enum: [normal, pending_review, approved, rejected] }
        warning_months_override: { type: [integer, "null"], minimum: 0 }

    ContractHistoryEntry:
      type: object
      required: [id, field, change_type, changed_at]
      properties:
        id: { type: integer, format: int64 }
        field: { type: string }
        old_value: { type: [string, "null"] }
        new_value: { type: [string, "null"] }
        user_id: { type: [integer, "null"], format: int64 }
        change_type: { type: string, enum: [sync, manual, validation, gestiona_webhook] }
        changed_at: { type: string, format: date-time }

    ContractExtension:
      type: object
      required: [id, number]
      properties:
        id: { type: integer, format: int64 }
        number: { type: integer }
        start_date: { type: [string, "null"], format: date }
        end_date: { type: [string, "null"], format: date }
        amount: { type: [string, "null"] }
        fiscal_year: { type: [integer, "null"] }

    ContractModification:
      type: object
      required: [id, number]
      properties:
        id: { type: integer, format: int64 }
        number: { type: integer }
        approved_at: { type: [string, "null"], format: date }
        type: { type: [string, "null"] }
        amount: { type: [string, "null"] }

    ContractStats:
      type: object
      required: [totals, minors, by_status, by_department, top_contractors]
      properties:
        totals:
          type: object
          required: [contracts, new_this_month, expiry_warning, possibly_finished, awarded_total, unique_contractors]
          properties:
            contracts: { type: integer }
            new_this_month: { type: integer }
            expiry_warning: { type: integer }
            possibly_finished: { type: integer }
            awarded_total: { type: string, description: Decimal serialitzat com a cadena. }
            unique_contractors: { type: integer }
        minors:
          type: object
          required: [count, amount]
          properties:
            count: { type: integer }
            amount: { type: string }
        by_status:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count: { type: integer }
        by_department:
          type: array
          items:
            type: object
            required: [id, name, count]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              count: { type: integer }
        top_contractors:
          type: array
          items:
            type: object
            required: [id, name, amount, count]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              amount: { type: string }
              count: { type: integer }

    ContractFacets:
      type: object
      required: [statuses, contract_types, procedures, years]
      properties:
        statuses:
          type: array
          items: { type: string }
        contract_types:
          type: array
          items: { type: string }
        procedures:
          type: array
          items: { type: string }
        years:
          type: array
          items: { type: integer }

    ExportRequest:
      type: object
      properties:
        format:
          type: string
          enum: [csv, xlsx]
          default: csv
        view:
          type: string
          enum: [user, all]
          default: user
        filters:
          type: object
          description: Mateixos filtres que el llistat de contractes.
          properties:
            q: { type: [string, "null"], maxLength: 200 }
            department_id: { type: [integer, "null"], format: int64 }
            unassigned: { type: [boolean, "null"] }
            contract_type: { type: [string, "null"] }
            status: { type: [string, "null"] }
            internal_status:
              type: [string, "null"]
              enum: [normal, pending_review, approved, rejected, null]
            expiry_warning: { type: [boolean, "null"] }
            possibly_finished: { type: [boolean, "null"] }
            year: { type: [integer, "null"] }
            contractor_id: { type: [integer, "null"], format: int64 }

    BulkAssignRequest:
      type: object
      required: [contract_ids, department_ids]
      properties:
        contract_ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 500
        department_ids:
          type: array
          items: { type: integer, format: int64 }
          minItems: 1
          maxItems: 20
        mode:
          type: string
          enum: [add, replace]
          default: add

    BulkAssignResult:
      type: object
      required: [updated, unchanged, missing]
      properties:
        updated: { type: integer }
        unchanged: { type: integer }
        missing:
          type: array
          description: Ids de contracte demanats que no existeixen.
          items: { type: integer, format: int64 }

    AwardCriterion:
      type: object
      required: [id, position, name]
      properties:
        id: { type: integer, format: int64 }
        position: { type: integer }
        name: { type: string }
        weight: { type: [string, "null"] }
        breakdown:
          type: [object, "null"]
          description: JSON original de la font (desglossament del criteri).

    CommitteeMember:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        first_name: { type: [string, "null"] }
        last_name: { type: [string, "null"] }
        role: { type: [string, "null"] }

    PhaseDocument:
      type: object
      required: [id, phase]
      properties:
        id: { type: integer, format: int64 }
        phase: { type: string }
        title: { type: [string, "null"] }
        doc_type: { type: [string, "null"] }
        size:
          type: [integer, "null"]
          description: Mida en bytes segons la font.
        download_url:
          type: [string, "null"]
          description: URL pública de descàrrega al portal d'origen.
        has_copy:
          type: boolean
          description: Hi ha còpia del fitxer a l'emmagatzematge local.

    Job:
      type: object
      description: |
        Treball en segon pla. Mai inclou el `payload` d'entrada: només
        estat, progrés i resultat.
      required: [id, type, status, progress, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, examples: ["system.heartbeat", "sync.contracts"] }
        status: { type: string, enum: [queued, running, success, failed, cancelled] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        progress_message: { type: [string, "null"] }
        result: { type: [object, "null"] }
        error: { type: [string, "null"] }
        attempts: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in:
          type: integer
          description: Segons de validesa del token d'accés.

    User:
      type: object
      description: |
        Representació pública d'un usuari. **Mai** inclou credencials ni tokens
        d'integracions de tercers (aquests viuen xifrats i no s'exposen).
      required: [id, name, email, role, active]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        dni: { type: [string, "null"] }
        can_audit: { type: boolean, default: false }
        can_plan: { type: boolean, default: false }
        auth_source:
          type: string
          enum: [local, ldap]
        departments:
          type: array
          items: { $ref: "#/components/schemas/DepartmentRef" }
        created_at: { type: string, format: date-time }

    UserCreate:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        password:
          allOf: [{ $ref: "#/components/schemas/Password" }]
          description: Obligatòria per a usuaris locals; absent per a usuaris de directori.
        department_ids:
          type: array
          items: { type: integer, format: int64 }
        can_audit: { type: boolean, default: false }
        can_plan: { type: boolean, default: false }

    UserUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        password: { $ref: "#/components/schemas/Password" }
        department_ids:
          type: array
          items: { type: integer, format: int64 }
        can_audit: { type: boolean }
        can_plan: { type: boolean }

    DepartmentRef:
      type: object
      required: [id, code, name]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }

    Department:
      allOf:
        - $ref: "#/components/schemas/DepartmentRef"
        - type: object
          required: [active]
          properties:
            description: { type: [string, "null"] }
            active: { type: boolean }
            gestiona_group:
              type: [object, "null"]
              description: Grup de Gestiona associat, si la integració és activa.
              properties:
                id: { type: string }
                name: { type: string }
                href: { type: string, format: uri }
            created_at: { type: string, format: date-time }

    DepartmentCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string }

    DepartmentUpdate:
      type: object
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string }
        active: { type: boolean }
        gestiona_group_id: { type: [string, "null"] }
