          description: Resultat de la verificació
          content:
            application/json:
              schema:
                type: object
                required: [status, checked]
                properties:
                  status: { type: string, enum: [ok, broken] }
                  checked: { type: integer }
                  first_broken_id: { type: integer }
                  detail: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────── service-accounts ─────────────────────────
  /service-accounts:
    get:
      tags: [service-accounts]
      operationId: listServiceAccounts
      summary: Llista de service accounts (mai la clau; prefix i últim ús)
      x-required-scopes: [service_accounts:manage]
      responses:
        "200":
          description: Comptes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [service-accounts]
      operationId: createServiceAccount
      summary: Crea una API key (la clau NOMÉS es mostra en aquesta resposta)
      x-required-scopes: [service_accounts:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
                description: { type: [string, "null"], maxLength: 1000 }
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: string }
                  description: Accions de la matriu A2 (es validen).
                expires_at: { type: [string, "null"], format: date-time }
      responses:
        "201":
          description: Compte creat amb la clau en clar (única vegada)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ServiceAccount"
                  - type: object
                    required: [key]
                    properties:
                      key: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /service-accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    patch:
      tags: [service-accounts]
      operationId: updateServiceAccount
      summary: Edita (scopes, actiu, caducitat)
      x-required-scopes: [service_accounts:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
                description: { type: [string, "null"], maxLength: 1000 }
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: string }
                active: { type: boolean }
                expires_at: { type: [string, "null"], format: date-time }
      responses:
        "200":
          description: Actualitzat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [service-accounts]
      operationId: deleteServiceAccount
      summary: Revoca i elimina la clau
      x-required-scopes: [service_accounts:manage]
      responses:
        "204": { description: Revocada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

