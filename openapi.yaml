      tags: [service-accounts]
      operationId: updateServiceAccount
      summary: Edita (scopes, actiu, caducitat)
      x-required-scopes: [service_accounts:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
                description: { type: [string, "null"], maxLength: 1000 }
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: string }
                active: { type: boolean }
                expires_at: { type: [string, "null"], format: date-time }
      responses:
        "200":
          description: Actualitzat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [service-accounts]
      operationId: deleteServiceAccount
      summary: Revoca i elimina la clau
      x-required-scopes: [service_accounts:manage]
      responses:
        "204": { description: Revocada }
        "401": { $ref: "#/components/responses/Unauthorized" }
