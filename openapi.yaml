        - name: page[cursor]
          in: query
          schema: { type: string }
        - name: filter[action]
          in: query
          description: Prefix de l'acció (p. ex. `auth.`)
          schema: { type: string, maxLength: 100 }
        - name: filter[actor_type]
          in: query
          schema: { type: string, enum: [user, agent, system] }
        - name: filter[actor_id]
          in: query
          schema: { type: integer }
        - name: filter[success]
          in: query
          schema: { type: boolean }
        - name: filter[resource_type]
          in: query
          schema: { type: string, maxLength: 100 }
        - name: filter[resource_id]
          in: query
          schema: { type: string, maxLength: 100 }
        - name: filter[trace_id]
          in: query
          schema: { type: string, maxLength: 100 }
        - name: filter[from]
          in: query
          schema: { type: string, format: date-time }
        - name: filter[to]
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Entrades d'auditoria
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
