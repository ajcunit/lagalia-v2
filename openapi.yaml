openapi: 3.1.0

# ─────────────────────────────────────────────────────────────────────────────
# LAGALia v2 — Contracte API (font de veritat)
#
# Aquest fitxer és una SPEC EXECUTABLE: la CI verifica que la implementació el
# compleix (contract testing) i el client TypeScript del frontend es genera
# d'aquí. Cap endpoint pot existir al codi sense ser aquí.
#
# ABAST ACTUAL: Fase 0 del roadmap (auth, usuaris, departaments, salut, setup).
# Les fases següents l'amplien seguint docs/05-api.md, que conté el mapa
# complet de recursos previstos.
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: LAGALia — Gestió de contractació pública
  version: 0.1.0
  description: |
    API de la plataforma de gestió de contractació pública de l'Ajuntament de Cunit.

    **API first**: tota funcionalitat del sistema és accessible per aquesta API.
    La interfície web n'és un client més, igual que els agents d'IA, n8n o
    qualsevol integració de tercers.

    Convencions generals a `docs/05-api.md`.
  contact:
    name: Ajuntament de Cunit
  license:
    name: EUPL-1.2
    identifier: EUPL-1.2

servers:
  - url: /api/v1
    description: Servidor actual

tags:
  - name: auth
    description: Autenticació i sessió
  - name: me
    description: Usuari actual
  - name: users
    description: Gestió d'usuaris (admin)
  - name: departments
    description: Departaments
  - name: setup
    description: Inicialització del sistema
  - name: system
    description: Salut i estat
  - name: jobs
    description: Treballs en segon pla (cua, progrés, cancel·lació)
  - name: contracts
    description: Contractes majors (nucli de contractació)
  - name: minor-contracts
    description: Contractes menors (amb liquidacions)
  - name: contractors
    description: Adjudicataris normalitzats (rànquing, fitxa, duplicats)
  - name: tasks
    description: Tasques i recordatoris de contracte (mòdul nou v2)
  - name: webhooks
    description: Webhooks sortints signats (outbox transaccional)
  - name: service-accounts
    description: API keys de servei amb scopes granulars
  - name: config
    description: Paràmetres i connectors (secrets sempre write-only)
  - name: audit
    description: Auditoria de seguretat (append-only, cadena de hash)
  - name: sync
    description: Sincronitzacions amb fonts externes (historial i llançament)
  - name: public-registry
    description: SuperBuscador — registre públic de contractació de tot Catalunya
  - name: favorites
    description: Carpetes personals de favorits (snapshot d'expedients externs)
  - name: reference
    description: Diccionaris de referència (CPV)
  - name: plan
    description: Pla anual de contractació (workflow d'aprovació)
  - name: ai
    description: Plataforma d'IA — perfils de proveïdor i execucions
  - name: compliance
    description: Verificador de compliment LCSP (motor de regles determinista)
  - name: docgen
    description: Generador documental amb IA (projectes PPT/PPA/Informe, RAG amb fonts)
  - name: chat
    description: Xat general i per expedient, amb historial persistent (B-016)

security:
  - bearerAuth: []

paths:
  # ───────────────────────────── system ─────────────────────────────
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness
      description: Comprova que el servei respon. Públic.
      security: []
      responses:
        "200":
          description: Servei viu
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string, examples: ["0.1.0"] }

  /health/ready:
    get:
      tags: [system]
      operationId: getReadiness
      summary: Readiness amb estat de dependències
      x-required-scopes: [system:read]
      responses:
        "200":
          description: Estat de les dependències
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status: { type: string, enum: [ok, degraded, failing] }
                  checks:
                    type: array
                    items:
                      type: object
                      required: [name, status]
                      properties:
                        name: { type: string, examples: ["database", "redis", "storage"] }
                        status: { type: string, enum: [ok, degraded, failing] }
                        detail: { type: string }
                        latency_ms: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────────────── setup ─────────────────────────────
  /setup/status:
    get:
      tags: [setup]
      operationId: getSetupStatus
      summary: Indica si el sistema encara no s'ha inicialitzat
      description: Públic. Únic endpoint que revela informació abans de l'autenticació.
      security: []
      responses:
        "200":
          description: Estat d'inicialització
          content:
            application/json:
              schema:
                type: object
                required: [needs_setup]
                properties:
                  needs_setup:
                    type: boolean
                    description: Cert quan no hi ha cap usuari al sistema.

  /setup/initialize:
    post:
      tags: [setup]
      operationId: initializeSystem
      summary: Crea l'usuari administrador inicial i la configuració per defecte
      description: |
        Només es pot executar quan `needs_setup` és cert. Rate limit estricte.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
                email: { type: string, format: email }
                password: { $ref: "#/components/schemas/Password" }
                organization_name: { type: string }
                ine10_code: { $ref: "#/components/schemas/Ine10Code" }
      responses:
        "201":
          description: Sistema inicialitzat
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "403":
          $ref: "#/components/responses/Problem"
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ───────────────────────────── auth ─────────────────────────────
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Autentica amb credencials locals o LDAP
      description: |
        Prova primer el directori (si el connector LDAP és actiu) i cau a
        credencials locals. Els intents fallits es registren a l'auditoria.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Sessió iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Compte desactivat
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Renova la sessió (rotació de refresh token)
      description: |
        El refresh token es rota a cada ús. La reutilització d'un token ja rotat
        revoca tota la família de tokens (detecció de robatori).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Sessió renovada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoca la sessió actual
      responses:
        "204": { description: Sessió revocada }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/ephemeral:
    post:
      tags: [auth]
      operationId: createEphemeralToken
      summary: Emet un token efímer d'un sol ús
      description: |
        Per a casos on no es pot enviar la capçalera `Authorization`: subscripció
        a esdeveniments de jobs (SSE) i descàrregues directes. Caduca en minuts i
        només serveix per al recurs sol·licitat. Mai s'accepta un JWT normal per
        query string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose: { type: string, enum: [job_events, download] }
                resource: { type: string, description: "Identificador del recurs autoritzat" }
      responses:
        "201":
          description: Token emès
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────────── me ─────────────────────────────
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Perfil de l'usuari actual
      responses:
        "200":
          description: Usuari actual
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Actualitza el perfil propi
      description: Només nom, DNI i contrasenya. El rol i el correu no són editables per l'usuari.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 255 }
                dni: { type: string }
                password: { $ref: "#/components/schemas/Password" }
      responses:
        "200":
          description: Perfil actualitzat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/permissions:
    get:
      tags: [me]
      operationId: getMyPermissions
      summary: Permisos efectius de l'usuari actual
      description: |
        La interfície **no dedueix** permisos a partir del rol: els rep d'aquí.
        Retorna les accions permeses (segons la matriu de l'annex A2) i l'abast
        departamental aplicable.
      responses:
        "200":
          description: Permisos efectius
          content:
            application/json:
              schema:
                type: object
                required: [role, actions, scope]
                properties:
                  role: { $ref: "#/components/schemas/Role" }
                  actions:
                    type: array
                    description: Accions permeses, en format `recurs:acció`.
                    items: { type: string, examples: ["contracts:read", "contracts:write"] }
                  scope:
                    type: object
                    required: [type]
                    properties:
                      type: { type: string, enum: [all, departments] }
                      department_ids:
                        type: array
                        items: { type: integer, format: int64 }
                  can_switch_view:
                    type: boolean
                    description: Si l'usuari pot demanar abast complet (Vista Admin).
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ─────────────────────────── contracts ───────────────────────────
  /contracts:
    get:
      tags: [contracts]
      operationId: listContracts
      summary: Llistat de contractes (abast departamental)
      description: |
        L'abast s'aplica al servidor: amb accés departamental només es veuen
        els contractes dels departaments propis o dels quals s'és responsable.
      x-required-scopes: [contracts:read]
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/ViewScope"
        - name: q
          in: query
          description: Cerca lliure per expedient, objecte o adjudicatari.
          schema: { type: string, maxLength: 200 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [published_at, -published_at, calculated_end_date, -calculated_end_date,
                   award_amount, -award_amount, file_code, -file_code]
            default: "-published_at"
        - name: filter[department_id]
          in: query
          schema: { type: integer, format: int64 }
        - name: filter[unassigned]
          in: query
          description: Només contractes sense cap departament assignat.
          schema: { type: boolean }
        - name: filter[contract_type]
          in: query
          schema: { type: string }
        - name: filter[status]
          in: query
          schema: { type: string }
        - name: filter[internal_status]
          in: query
          schema: { type: string, enum: [normal, pending_review, approved, rejected] }
        - name: filter[expiry_warning]
          in: query
          schema: { type: boolean }
        - name: filter[possibly_finished]
          in: query
          schema: { type: boolean }
        - name: filter[year]
          in: query
          description: Exercici (any de publicació).
          schema: { type: integer }
        - name: filter[contractor_id]
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Pàgina de contractes
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContractSummary" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [contracts]
      operationId: createContract
      summary: Alta manual d'un contracte
      x-required-scopes: [contracts:create]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractCreate" }
      responses:
        "201":
          description: Contracte creat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Ja existeix un contracte amb la mateixa clau natural
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /contracts/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [contracts]
      operationId: getContract
      summary: Detall d'un contracte (amb lots germans i comptadors)
      description: Fora de l'abast departamental la resposta és `404`.
      x-required-scopes: [contracts:read]
      responses:
        "200":
          description: Contracte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [contracts]
      operationId: updateContract
      summary: Edició parcial segons la matriu de permisos
      description: |
        Amb `contracts:update` (admin, gestió de contractació) tots els camps;
        amb només `contracts:update_warning` (responsable de departament, dins
        del seu abast), únicament `warning_months_override`.
      x-required-scopes: [contracts:update, contracts:update_warning]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractUpdate" }
      responses:
        "200":
          description: Contracte actualitzat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /contracts/{id}/history:
    get:
      tags: [contracts]
      operationId: getContractHistory
      summary: Historial de canvis
      x-required-scopes: [contracts:read]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageCursor"
      responses:
        "200":
          description: Historial (descendent)
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContractHistoryEntry" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contracts/{id}/extensions:
    get:
      tags: [contracts]
      operationId: getContractExtensions
      summary: Pròrrogues del contracte
      x-required-scopes: [contracts:read]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Pròrrogues
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContractExtension" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contracts/{id}/modifications:
    get:
      tags: [contracts]
      operationId: getContractModifications
      summary: Modificacions del contracte
      x-required-scopes: [contracts:read]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Modificacions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ContractModification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contracts/stats:
    get:
      tags: [contracts]
      operationId: getContractsStats
      summary: KPIs del dashboard (dins l'abast de l'usuari)
      x-required-scopes: [contracts:read]
      parameters:
        - $ref: "#/components/parameters/ViewScope"
        - name: filter[year]
          in: query
          schema: { type: integer }
        - name: filter[amount_min]
          in: query
          schema: { type: number, minimum: 0 }
        - name: filter[amount_max]
          in: query
          schema: { type: number, minimum: 0 }
      responses:
        "200":
          description: Estadístiques
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /contracts/facets:
    get:
      tags: [contracts]
      operationId: getContractsFacets
      summary: Valors distincts per als filtres del llistat
      x-required-scopes: [contracts:read]
      parameters:
        - $ref: "#/components/parameters/ViewScope"
      responses:
        "200":
          description: Facets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractFacets" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /contracts/{id}/actions/finish:
    post:
      tags: [contracts]
      operationId: finishContract
      summary: Finalitza el contracte (estat → Finalitzat)
      x-required-scopes: [contracts:close_alert]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Contracte actualitzat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /contracts/{id}/actions/dismiss-expiry:
    post:
      tags: [contracts]
      operationId: dismissContractExpiry
      summary: Descarta l'alerta de venciment (persistent fins que canviï la data final)
      x-required-scopes: [contracts:close_alert]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Contracte actualitzat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contract" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /contracts/{id}/actions/enrich:
    post:
      tags: [contracts]
      operationId: enrichContract
      summary: Encua l'enriquiment del contracte (job enrich.contract)
      x-required-scopes: [contracts:enrich]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "202":
          description: Job encuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /contracts/exports:
    post:
      tags: [contracts]
      operationId: createContractsExport
      summary: Encua l'exportació del llistat filtrat (CSV o XLSX)
      description: |
        L'abast efectiu (view + rol) es resol a l'encuament: l'export conté
        només el que l'usuari veu. La descàrrega es fa amb token efímer.
      x-required-scopes: [contracts:export]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "202":
          description: Job d'exportació encuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /contracts/exports/{id}/download:
    get:
      tags: [contracts]
      operationId: downloadContractsExport
      summary: Descarrega el fitxer d'una exportació completada
      description: |
        Autorització per token efímer d'un sol ús (`POST /auth/ephemeral`,
        propòsit `download`, recurs = id del job). Mai el JWT de sessió.
      security: []
      parameters:
        - $ref: "#/components/parameters/ResourceUuid"
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      responses:
        "200":
          description: Fitxer exportat
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /contracts/bulk/assign-departments:
    post:
      tags: [contracts]
      operationId: bulkAssignDepartments
      summary: Assignació massiva de departaments
      x-required-scopes: [contracts:bulk_assign]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkAssignRequest" }
      responses:
        "200":
          description: Resum de l'assignació
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkAssignResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
