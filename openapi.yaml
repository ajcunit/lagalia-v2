          in: query
          schema: { type: number, minimum: 0 }
        - name: filter[amount_max]
          in: query
          schema: { type: number, minimum: 0 }
        - name: filter[from]
          in: query
          schema: { type: string, format: date-time }
        - name: filter[to]
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
