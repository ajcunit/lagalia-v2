# Detecció de secrets (CI, docs/06-seguretat.md §4).
#
# Regla del projecte: cap secret real al repositori. Els secrets
# d'infraestructura van al `.env` (ignorat) i les credencials operatives
# es desen XIFRADES a la base de dades.
#
# Aquest fitxer només declara les excepcions revisades: constants de
# prova de la bateria de tests, que han de ser literals per força i no
# obren cap accés (la BD de test es recrea a cada execució).

[extend]
useDefault = true

[[rules]]
# Manté la regla genèrica, però ignorant els fitxers de test.
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]
[rules.allowlist]
paths = ['''backend/tests/.*''', '''frontend/src/test/.*''']

[allowlist]
description = "Excepcions revisades del projecte"
paths = [
    # Plantilla d'entorn: només noms de variable, mai valors.
    '''\.env\.example''',
    # Claus de test del workflow (32 bytes de zeros: inservibles fora de CI).
    '''\.github/workflows/ci\.yml''',
]
