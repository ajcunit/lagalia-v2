# Entorn de desenvolupament.
#
#   docker compose up -d                      → només infraestructura
#   docker compose --profile app up -d --build → + api, worker, scheduler, frontend
#
# El perfil "app" requereix que existeixin backend/ i frontend/ (Fase 0).
# Per a producció cal, a més, un reverse proxy amb TLS (Caddy/Nginx) davant.

name: lagalia-v2

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lagalia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lagalia}
      POSTGRES_DB: ${POSTGRES_DB:-lagalia}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lagalia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lagalia}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-lagalia-dev-secret}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lagalia}:${POSTGRES_PASSWORD:-lagalia}@db:5432/${POSTGRES_DB:-lagalia}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://storage:9000
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Processa la cua de treballs: sincronitzacions, enriquiment, IA, webhooks.
  worker:
    profiles: ["app"]
    build:
      context: ./backend
    restart: unless-stopped
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lagalia}:${POSTGRES_PASSWORD:-lagalia}@db:5432/${POSTGRES_DB:-lagalia}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://storage:9000
    depends_on:
      api: { condition: service_started }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Encua els treballs programats. Una sola instància: fa servir advisory locks
  # a PostgreSQL per garantir que no hi ha execucions duplicades.
  scheduler:
    profiles: ["app"]
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.jobs.scheduler"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lagalia}:${POSTGRES_PASSWORD:-lagalia}@db:5432/${POSTGRES_DB:-lagalia}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      replicas: 1

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # El dev server fa proxy de /api cap al servei api del compose.
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  miniodata:
