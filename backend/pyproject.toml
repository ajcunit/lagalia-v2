[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lagalia-backend"
version = "0.1.0"
description = "Backend API de LAGALia v2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.2,<3",
  "pydantic-settings>=2.2.1",
  "structlog>=24.4.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.30.0",
  "alembic>=1.13.0",
  "argon2-cffi>=23.1.0",
  "pyjwt>=2.9.0",
  "redis>=5.0.0",
  "email-validator>=2.2.0",
  "cryptography>=43.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pip-audit>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "S",   # bandit (seguretat)
]

[tool.ruff.lint.per-file-ignores]
# S101: assert als tests és l'esperat. S105/S106: secrets sintètics de test.
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
