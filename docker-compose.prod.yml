# Desplegament de servidor (test/producció) — fitxer COMPLET i autònom.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# A Portainer és l'ÚNIC fitxer de l'stack («Compose path»:
# docker-compose.prod.yml). No es combina amb docker-compose.yml, que és el
# de desenvolupament: Portainer CE carrega un sol fitxer, i una
# superposició tota sola no té ni imatges ni contextos de build.
#
# Diferències amb el compose de desenvolupament (specs/deployment.md):
#
# 1. El frontend NO és el servidor de Vite: és el build estàtic servit per
#    **Caddy**, que a més fa de reverse proxy amb TLS cap a l'API (mateix
#    origen, com espera el client generat). És l'única entrada publicada.
# 2. La infraestructura (BD, Redis, MinIO) i l'API NO publiquen cap port al
#    host: es parlen per la xarxa interna del compose. Evita xocs amb
#    altres stacks del servidor i no exposa mai la base de dades.
# 3. Cap fitxer `.env`: la configuració són variables de l'stack (a
#    Portainer, «Environment variables»: a mà o amb «Load variables from
#    .env file»). Així el desplegament des de Git no necessita secrets al
#    repositori.
#
# Variables obligatòries (l'stack falla ràpid dient quina falta):
#   SECRET_KEY · ENCRYPTION_KEY · POSTGRES_PASSWORD · CORS_ORIGINS ·
#   S3_SECRET_KEY

name: lagalia-v2

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DEBUG: ${DEBUG:-false}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  # Obligatoris: l'aplicació no arrenca sense ells (docs/06-seguretat.md §4).
  SECRET_KEY: ${SECRET_KEY:?cal SECRET_KEY}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?cal ENCRYPTION_KEY}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lagalia}:${POSTGRES_PASSWORD:?cal POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lagalia}
  REDIS_URL: redis://redis:6379/0
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  CORS_ORIGINS: ${CORS_ORIGINS:?cal CORS_ORIGINS amb la URL real}
  # Rangs CIDR admesos. Amb Docker NO hi va la IP del servidor: el
  # contenidor veu la passarel·la de la xarxa del compose.
  TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12}
  RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-5/minute}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  S3_ENDPOINT_URL: http://storage:9000
  S3_BUCKET: ${S3_BUCKET:-lagalia}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lagalia}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?cal S3_SECRET_KEY}
  # La ruta és relativa a /srv/app dins del contenidor; el fitxer es munta.
  OUTBOUND_CA_BUNDLE: ${OUTBOUND_CA_BUNDLE:-./ops/outbound-ca-bundle.pem}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-ops-mount: &ops-mount
  - ./ops/outbound-ca-bundle.pem:/srv/app/ops/outbound-ca-bundle.pem:ro

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lagalia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?cal POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lagalia}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lagalia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-lagalia}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?cal S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *app-env
    volumes: *ops-mount
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')
      interval: 15s
      timeout: 5s
      retries: 5

  # Processa la cua de treballs: sincronitzacions, enriquiment, IA, webhooks.
  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    environment: *app-env
    volumes: *ops-mount
    depends_on:
      api: { condition: service_started }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Encua els treballs programats (sincronització nocturna, purga de
  # retenció, recordatoris de tasques). Una sola instància: fa servir
  # advisory locks de PostgreSQL per no duplicar execucions.
  scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.jobs.scheduler"]
    environment: *app-env
    volumes: *ops-mount
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      replicas: 1

  # Única entrada publicada: SPA estàtica + reverse proxy amb TLS.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      # https://lagalia.cunit.cat (TLS automàtic) · lagalia.local (certificat
      # intern de Caddy) · :80 (HTTP pla, només amb un altre proxy davant).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      # Certificats emesos per Caddy: persistents entre desplegaments (si no,
      # Let's Encrypt es tornaria a demanar a cada reinici).
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
